<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackTravel</title>
    <link rel="shortcut icon" href="./assets/images/icon.webp" type="image/webp">
    <link rel="stylesheet" href="css/variables.css">
</head>
<div class="app-container">
    <aside class="col-left" id="col-left"></aside>

    <main class="col-middle" id="col-middle">
        <div id="view-planner" class="view-panel">
            <header class="search-section" id="search-section"></header>
            <div class="results-meta-bar">
                <span class="results-count" id="results-count">Betöltés...</span>
            </div>
            <div class="results-scroll">
                <div class="places-grid" id="places-grid"></div>
            </div>
        </div>
        <div id="view-trips" class="view-panel" style="display: none;"></div>
    </main>

    <aside class="col-right" id="col-right"></aside>
</div>

<div id="toast-notice" class="toast-notice"></div>
</html>
